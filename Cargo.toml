[package]
name = "vault-mcp-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "A generic, reusable MCP (Model Context Protocol) server shell for local-first personal-data apps. Bring your own backend (a contacts/company store, or anything else shaped like one) by implementing McpBackend."
license = "MIT"
repository = "https://github.com/joshliaitwin/proactive-vault-mcp"

[lib]
name = "vault_mcp_core"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
rmcp = { version = "2", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
